    <title>Aven</title>
    <!-- The launch screen, drawn by the very first paint before any script runs: ink with the launch orb in the middle,
         exactly as the Android launch screen shows it, so the hand-over from the phone to the page is invisible. The app
         then takes it over (src/ui/launch.ts): the logo comes alive as the orb and flows down into the dock. -->
    <style>
      html, body { background: #05060b; }
      #launch { position: fixed; inset: 0; z-index: 900; background: #05060b; pointer-events: none; contain: strict; }
      #launch .launch-logo { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; }
      /* until the launch has started the live orb waits unseen under the logo; the first screen's blocks wait to rise until
         the orb lands (launch.ts) */
      html[data-launch] .sphere-stage canvas { opacity: 0; }
      html[data-rise-hold] .screen > *, html[data-rise-hold] .subpage > * { animation-play-state: paused; }
      #launch .launch-slot { position: absolute; left: 50%; top: 50%; width: 151.52px; height: 151.52px; margin: -75.76px 0 0 -75.76px; } /* the live orb is drawn 0.66 of its box: 100 px, as the logo */
    </style>
  </head>
