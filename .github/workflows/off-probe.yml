name: Food lookup probe (temporary)
on:
  push:
    branches: [claude/project-thread-1uibw1]
    paths: ['probe/**', '.github/workflows/off-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/build-dk-foods.mjs
      - run: |
          ls -la src/data/off/ && gzip -c src/data/off/off-dk.json | wc -c
          node -e "const d=require('./src/data/off/off-dk.json');for(const r of d.rows.filter(r=>/cheasy/i.test(r[2])&&/vanil/i.test(r[1])))console.log(JSON.stringify(r))"
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo no-commit
